  <text x="256" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">C1 CAE</text>

  <!-- Mini Flame on top right -->
  <path d="M380 90 C380 90 410 120 410 145 C410 162 396 175 380 175 C364 175 350 162 350 145 C350 135 356 125 365 115 C365 115 365 130 375 130 C380 130 382 120 380 90 Z" fill="url(#flameGrad)"/>
